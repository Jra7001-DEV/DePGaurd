[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "depguard"
version = "0.1.0"
description = "Defensive web vulnerability and dependency scanner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9,<4",
    "alembic>=1.13,<2",
    "argon2-cffi>=23.1,<26",
    "beautifulsoup4>=4.12,<5",
    "cvss>=3.2,<4",
    "fastapi>=0.111,<1",
    "httpx>=0.27,<1",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1,<4",
    "lxml>=5.2,<7",
    "matplotlib>=3.9,<4",
    "packaging>=24.1,<27",
    "pydantic-settings>=2.3,<3",
    "python-multipart>=0.0.9,<1",
    "reportlab>=4.2,<5",
    "semantic-version>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "typer>=0.12,<1",
    "rich>=13.7,<15",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "black>=24.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-reportlab>=4.2",
]

[project.scripts]
depguard = "depguard.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"depguard.web" = ["static/*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
packages = ["depguard"]

[[tool.mypy.overrides]]
module = ["semantic_version.*", "cvss.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["depguard"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
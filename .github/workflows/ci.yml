name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: black --check src tests
      - run: mypy src
      - run: pytest --cov=depguard --cov-report=term-missing
      - run: docker build -t depguard .
